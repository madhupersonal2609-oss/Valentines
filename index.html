<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Subbu 💖</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #ffdae0;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 100 100"><path d="M50 80c-20-15-30-25-30-35 0-10 10-15 15-15 5 0 10 5 15 10 5-5 10-10 15-10 5 0 15 5 15 15 0 10-10 20-30 35z" fill="%23ffb3c1" fill-opacity="0.5"/></svg>');
            font-family: 'Poppins', sans-serif;
            display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; overflow: hidden;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px; border-radius: 40px; text-align: center; width: 350px; 
            box-shadow: 0 20px 50px rgba(214, 51, 132, 0.2); border: 2px solid white;
            position: relative;
        }

        /* THE POOKIE BOX */
        .pookie-container {
            width: 150px; height: 150px; margin: 0 auto 20px; position: relative;
        }

        /* Drawing a "Code-Based" Pookie so it NEVER fails to load */
        .pookie-face {
            width: 100px; height: 85px; background: white; border-radius: 50% 50% 45% 45%;
            position: absolute; left: 25px; top: 30px; border: 3px solid #555;
            transition: all 0.3s ease;
        }
        .ear { width: 30px; height: 30px; background: white; border-radius: 50%; border: 3px solid #555; position: absolute; top: 15px; }
        .ear.l { left: 20px; } .ear.r { right: 20px; }
        .eye { width: 8px; height: 8px; background: #333; border-radius: 50%; position: absolute; top: 40px; transition: all 0.3s; }
        .eye.l { left: 30%; } .eye.r { right: 30%; }
        .blush { width: 15px; height: 8px; background: #ffb3c1; border-radius: 50%; position: absolute; top: 50px; opacity: 0.8; }
        .blush.l { left: 15%; } .blush.r { right: 15%; }
        .mouth { width: 12px; height: 8px; border: 2px solid #333; border-top: 0; border-radius: 0 0 10px 10px; position: absolute; top: 55px; left: 44%; transition: all 0.3s; }

        /* ANIMATIONS */
        @keyframes cry { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(5px); } }
        @keyframes shake { 0% { transform: translate(1px, 1px); } 50% { transform: translate(-2px, -1px); } 100% { transform: translate(1px, 1px); } }

        h1 { color: #d63384; font-size: 20px; margin-bottom: 30px; }
        .buttons { display: flex; gap: 15px; justify-content: center; align-items: center; }
        button { padding: 12px 25px; font-size: 16px; border: none; border-radius: 50px; cursor: pointer; font-weight: 600; transition: all 0.3s; }
        #yesBtn { background-color: #28a745; color: white; }
        #noBtn { background-color: #dc3545; color: white; position: relative; }

        #celebration { display: none; text-align: center; color: white; }
        .official-title { font-family: 'Dancing Script', cursive; font-size: 45px; }
    </style>
</head>
<body>

    <div id="main-content" class="container">
        <div class="pookie-container" id="pookie">
            <div class="ear l"></div><div class="ear r"></div>
            <div class="pookie-face" id="face">
                <div class="eye l" id="el"></div><div class="eye r" id="er"></div>
                <div class="blush l"></div><div class="blush r"></div>
                <div class="mouth" id="m"></div>
            </div>
        </div>
        
        <h1 id="question">Will you be my valentine, Subbu? ✨</h1>

        <div class="buttons">
            <button id="yesBtn" onclick="celebrate()">Yes ! 😍</button>
            <button id="noBtn" onclick="handleNo()">No 🤐</button>
        </div>
    </div>

    <div id="celebration">
        <h1 class="official-title">It's Official! ❤️</h1>
        <p style="background: rgba(255,255,255,0.2); padding: 20px; border-radius: 20px; line-height: 1.6;">
            "Thanks for being the most wonderful, idiotic, sadistic and closest person to my heart ❤️!! Ofcourse you don't have choice of saying NO anymore ! You are stuck with me and me with you FOREVER!"
        </p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <script>
        let clickCount = 0;
        const noPhrases = ["Are you sure?", "Pleaseeee🥹", "I'll kill you!! 😡", "Just click Yes!🥳", "Last Chance!"];

        function handleNo() {
            clickCount++;
            const face = document.getElementById('face');
            const mouth = document.getElementById('m');
            const yesBtn = document.getElementById('yesBtn');
            const noBtn = document.getElementById('noBtn');

            // --- LIVE EXPRESSION CHANGES ---
            if (clickCount === 1) { // SURPRISED
                mouth.style.height = "12px"; mouth.style.width = "12px"; mouth.style.borderRadius = "50%";
            } else if (clickCount === 2) { // SAD
                face.style.transform = "translateY(10px)";
                mouth.style.borderRadius = "10px 10px 0 0"; mouth.style.borderTop = "2px solid #333"; mouth.style.borderBottom = "0";
            } else if (clickCount === 3) { // ANGRY
                face.style.background = "#ffccd5";
                document.getElementById('pookie').style.animation = "shake 0.1s infinite";
            }

            // --- BUTTON LOGIC ---
            let size = 16 + (clickCount * 40);
            yesBtn.style.fontSize = size + "px";
            yesBtn.style.padding = (size/2) + "px " + size + "px";

            if (clickCount <= noPhrases.length) noBtn.innerText = noPhrases[clickCount-1];
            if (clickCount >= 4) {
                noBtn.style.position = 'fixed';
                noBtn.style.left = Math.random() * 80 + '%';
                noBtn.style.top = Math.random() * 80 + '%';
            }
        }

        function celebrate() {
            document.getElementById('main-content').style.display = 'none';
            document.getElementById('celebration').style.display = 'block';
            document.body.style.backgroundColor = "#d63384";
            confetti({ particleCount: 200, spread: 100, origin: { y: 0.6 } });
        }
    </script>
</body>
</html>
