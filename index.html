<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Subbu 💖</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --baby-pink: #ffdae0;
            --deep-pink: #d63384;
        }

        body {
            background-color: var(--baby-pink);
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 100 100"><path d="M50 80c-20-15-30-25-30-35 0-10 10-15 15-15 5 0 10 5 15 10 5-5 10-10 15-10 5 0 15 5 15 15 0 10-10 20-30 35z" fill="%23ffb3c1" fill-opacity="0.5"/></svg>');
            font-family: 'Poppins', sans-serif;
            display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; overflow: hidden;
            transition: background 0.5s ease;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px; border-radius: 40px; box-shadow: 0 20px 50px rgba(214, 51, 132, 0.2);
            text-align: center; width: 350px; z-index: 10; border: 2px solid white;
        }

        #pookie-img {
            width: 180px; height: 180px; object-fit: contain; margin-bottom: 20px;
            transition: transform 0.3s ease;
        }

        h1 { color: var(--deep-pink); font-size: 22px; margin-bottom: 30px; line-height: 1.4; }

        .buttons { display: flex; gap: 15px; justify-content: center; align-items: center; }

        button {
            padding: 12px 25px; font-size: 16px; border: none; border-radius: 50px;
            cursor: pointer; font-weight: 600; transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #yesBtn { background-color: #28a745; color: white; box-shadow: 0 4px 15px rgba(40,167,69,0.3); }
        #noBtn { background-color: #dc3545; color: white; position: relative; }

        #celebration { display: none; text-align: center; color: white; padding: 20px; z-index: 20; }
        .official-title { font-family: 'Dancing Script', cursive; font-size: 50px; margin-bottom: 15px; }
        .final-msg {
            background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(10px);
            padding: 25px; border-radius: 20px; font-size: 18px; border: 1px solid rgba(255,255,255,0.3);
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div id="main-content" class="container">
        <img id="pookie-img" src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHIzZTM3eXpueG94eG94eG94eG94eG94eG94eG94eG94eG94ZSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/cLS1cfxvGOPVpf9g3y/giphy.gif" alt="Asking">
        
        <h1 id="question">Will you be my valentine, Subbu? ✨</h1>

        <div class="buttons">
            <button id="yesBtn" onclick="celebrate()">Yes ! 😍</button>
            <button id="noBtn" onclick="handleNo()">No 🤐</button>
        </div>
    </div>

    <div id="celebration">
        <img src="https://media.tenor.com/XqT_uU_o_XgAAAAi/milk-and-mocha.gif" style="width: 250px; border-radius: 20px; margin-bottom: 20px;">
        <div class="official-title">It's Official!</div>
        <div class="final-msg">
            "Thanks for being the most wonderful, idiotic, sadistic and closest person to my heart ❤️!! Ofcourse you don't have choice of saying NO anymore ! You are stuck with me and me with you FOREVER!"
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <script>
        let clickCount = 0;
        
        // Progression of the Woman's Expressions
        const womanGifs = [
            "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHIzZTM3eXpueG94eG94eG94eG94eG94eG94eG94eG94eG94ZSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/cLS1cfxvGOPVpf9g3y/giphy.gif", // Asking
            "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHIzZTM3eXpueG94eG94eG94eG94eG94eG94eG94eG94eG94ZSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/L95W4wv8nnb9V0W1Qu/giphy.gif", // Annoyed/Sad
            "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHIzZTM3eXpueG94eG94eG94eG94eG94eG94eG94eG94eG94ZSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/OPU6wYfV5InyJdMd6K/giphy.gif", // Crying
            "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHIzZTM3eXpueG94eG94eG94eG94eG94eG94eG94eG94eG94ZSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/llsq863S41l3cWEnT0/giphy.gif", // Angry/Sadistic
            "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHIzZTM3eXpueG94eG94eG94eG94eG94eG94eG94eG94eG94ZSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/vVzH2Li3WdmEy9WnmS/giphy.gif"  // Despair
        ];

        const noPhrases = ["Are you sure?", "Pleaseeee🥹", " If you didn't click on Yes, I'll be sad and kill you!!", "I know you want Yes!🥳", "Last Chance!"];

        function handleNo() {
            clickCount++;
            const yesBtn = document.getElementById('yesBtn');
            const noBtn = document.getElementById('noBtn');
            const pookie = document.getElementById('pookie-img');

            // --- CHANGE WOMAN'S EXPRESSION ---
            if (clickCount < womanGifs.length) {
                pookie.src = womanGifs[clickCount];
            }

            // --- GROWTH LOGIC ---
            let yesSize = 16 + (clickCount * 45); 
            yesBtn.style.fontSize = yesSize + 'px';
            yesBtn.style.padding = (15 + clickCount * 15) + 'px ' + (30 + clickCount * 30) + 'px';
            
            // --- UPDATE TEXT ---
            if (clickCount <= noPhrases.length) noBtn.innerText = noPhrases[clickCount - 1];
            
            // --- MOVEMENT LOGIC ---
            if (clickCount >= 5) {
                noBtn.style.position = 'fixed';
                noBtn.style.left = Math.random() * 80 + '%';
                noBtn.style.top = Math.random() * 80 + '%';
            }
            if (clickCount >= 6) noBtn.style.display = 'none';
        }

        function celebrate() {
            document.getElementById('main-content').style.display = 'none';
            document.getElementById('celebration').style.display = 'block';
            document.body.style.backgroundColor = "#d63384";
            document.body.style.backgroundImage = "none";
            
            // Launch the celebration confetti!
            var end = Date.now() + (4 * 1000);
            (function frame() {
                confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#ffffff', '#ffb3c1'] });
                confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#ffffff', '#ffb3c1'] });
                if (Date.now() < end) { requestAnimationFrame(frame); }
            }());
        }
    </script>
</body>
</html>
