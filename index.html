<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Valentine?</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #ffdae0;
            background-image: url("https://www.transparenttextures.com/patterns/heart.png");
            font-family: 'Poppins', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            transition: background 0.5s ease;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 35px;
            box-shadow: 0 15px 40px rgba(214, 51, 132, 0.2);
            text-align: center;
            z-index: 10;
            width: 350px;
            border: 2px solid #ffb3c1;
        }

        #pookie-display {
            font-size: 90px;
            margin-bottom: 15px;
            display: block;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        h1 { color: #d63384; font-size: 22px; margin-bottom: 30px; line-height: 1.4; }
        
        .buttons { display: flex; gap: 20px; justify-content: center; align-items: center; }
        
        button {
            padding: 15px 30px;
            font-size: 18px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        #yesBtn { background-color: #28a745; color: white; }
        #noBtn { background-color: #dc3545; color: white; position: relative; }

        .celebration { display: none; padding: 20px; }
        .celebration h2 { font-family: 'Dancing Script', cursive; font-size: 36px; color: white; margin-bottom: 15px; }
        .celebration p { font-size: 18px; color: white; line-height: 1.6; font-weight: 400; }
    </style>
</head>
<body>

    <div id="main-content" class="container">
        <div id="pookie-display">🧸</div>
        <h1 id="question">Will you be my valentine, Subbu? ✨</h1>

        <div class="buttons" id="btnGroup">
            <button id="yesBtn" onclick="celebrate()">Yes ! 😍</button>
            <button id="noBtn" onclick="handleNo()">No 🤐</button>
        </div>
    </div>

    <div id="celebration" class="celebration" style="text-align: center; max-width: 450px;">
        <div style="font-size: 100px; margin-bottom: 10px;">💖💍✨</div>
        <h2>It's Official!</h2>
        <p>"Thanks for being the most wonderful, idiotic, sadistic and closest person to my heart ❤️!! Ofcourse you don't have choice of saying NO anymore ! You are stuck with me and me with you FOREVER!"</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <script>
        let clickCount = 0;
        const pookieMoods = ["🧸", "🤨", "🥹", "😡", "😭", "👿"];
        const noPhrases = [
            "Are you sure ?????",
            "Pleaseeeeeeeee🥹",
            "If you say no, I will be sad and will kill you!!!!",
            "I know you want to click Yes !!!!🥳",
            "Last Chance !!!!"
        ];

        function handleNo() {
            clickCount++;
            const yesBtn = document.getElementById('yesBtn');
            const noBtn = document.getElementById('noBtn');
            const pookie = document.getElementById('pookie-display');

            if (clickCount < pookieMoods.length) {
                pookie.innerText = pookieMoods[clickCount];
            }

            let yesSize = 18 + (clickCount * 35); 
            yesBtn.style.fontSize = yesSize + 'px';
            yesBtn.style.padding = (15 + clickCount * 12) + 'px ' + (30 + clickCount * 25) + 'px';

            let noSize = 18 - (clickCount * 2);
            noBtn.style.fontSize = Math.max(noSize, 4) + 'px';
            noBtn.style.padding = "5px 10px";

            if (clickCount <= noPhrases.length) {
                noBtn.innerText = noPhrases[clickCount - 1];
            }

            if (clickCount >= 5) {
                moveButton(noBtn);
            }
            if (clickCount >= 6) {
                noBtn.style.display = 'none';
                pookie.innerText = "💀"; 
            }
        }

        function moveButton(btn) {
            const x = Math.random() * (window.innerWidth - btn.offsetWidth);
            const y = Math.random() * (window.innerHeight - btn.offsetHeight);
            btn.style.position = 'fixed';
            btn.style.left = x + 'px';
            btn.style.top = y + 'px';
        }

        function celebrate() {
            document.getElementById('main-content').style.display = 'none';
            document.getElementById('celebration').style.display = 'block';
            document.body.style.backgroundColor = "#ff4d6d";
            document.body.style.backgroundImage = "none";
            
            // Expert touch: Confetti blast
            var duration = 5 * 1000;
            var animationEnd = Date.now() + duration;
            var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 0 };

            function randomInRange(min, max) { return Math.random() * (max - min) + min; }

            var interval = setInterval(function() {
                var timeLeft = animationEnd - Date.now();
                if (timeLeft <= 0) { return clearInterval(interval); }
                var particleCount = 50 * (timeLeft / duration);
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
            }, 250);
        }
    </script>
</body>
</html>
