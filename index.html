<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Subbu 💖</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --baby-pink: #ffdae0;
            --deep-pink: #d63384;
        }

        body {
            background-color: var(--baby-pink);
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 100 100"><path d="M50 80c-20-15-30-25-30-35 0-10 10-15 15-15 5 0 10 5 15 10 5-5 10-10 15-10 5 0 15 5 15 15 0 10-10 20-30 35z" fill="%23ffb3c1" fill-opacity="0.4"/></svg>');
            font-family: 'Poppins', sans-serif;
            display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; overflow: hidden;
        }

        /* Floating Hearts Animation */
        .heart {
            position: absolute; color: rgba(214, 51, 132, 0.5);
            animation: float 6s linear infinite; font-size: 20px; z-index: 1; pointer-events: none;
        }
        @keyframes float {
            0% { transform: translateY(110vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }

        .container {
            background: rgba(255, 255, 255, 0.98);
            padding: 40px; border-radius: 40px; box-shadow: 0 20px 50px rgba(214, 51, 132, 0.2);
            text-align: center; width: 320px; z-index: 10; border: 2px solid white;
        }

        /* Fixed height container for the GIF to prevent layout jumping */
        .gif-box {
            width: 100%; height: 200px; display: flex; align-items: center; justify-content: center; margin-bottom: 20px;
        }

        #pookie-img {
            max-width: 100%; max-height: 100%; object-fit: contain;
        }

        h1 { color: var(--deep-pink); font-size: 22px; margin-bottom: 30px; line-height: 1.4; }
        .buttons { display: flex; gap: 15px; justify-content: center; align-items: center; }

        button {
            padding: 12px 25px; font-size: 16px; border: none; border-radius: 50px;
            cursor: pointer; font-weight: 600; transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #yesBtn { background-color: #28a745; color: white; z-index: 100; }
        #noBtn { background-color: #dc3545; color: white; position: relative; z-index: 99; }

        #celebration { display: none; text-align: center; color: white; padding: 20px; z-index: 20; }
        .official-title { font-family: 'Dancing Script', cursive; font-size: 50px; margin-bottom: 15px; }
        .final-msg {
            background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(10px);
            padding: 25px; border-radius: 20px; font-size: 18px; border: 1px solid rgba(255,255,255,0.3);
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div id="heart-container"></div>

    <div id="main-content" class="container">
        <div class="gif-box">
            <img id="pookie-img" src="https://media1.tenor.com/m/On7be2S_T_wAAAAC/milk-and-mocha.gif" alt="Asking">
        </div>
        <h1 id="question">Will you be my valentine, Subbu? ✨</h1>
        <div class="buttons">
            <button id="yesBtn" onclick="celebrate()">Yes ! 😍</button>
            <button id="noBtn" onclick="handleNo()">No 🤐</button>
        </div>
    </div>

    <div id="celebration">
        <div class="gif-box">
            <img src="https://media1.tenor.com/m/XqT_uU_o_XgAAAAC/milk-and-mocha.gif" style="border-radius: 20px;">
        </div>
        <div class="official-title">It's Official!</div>
        <div class="final-msg">
            "Thanks for being the most wonderful, idiotic, sadistic and closest person to my heart ❤️!! Ofcourse you don't have choice of saying NO anymore ! You are stuck with me and me with you FOREVER!"
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <script>
        let clickCount = 0;

        function createHeart() {
            const container = document.getElementById('heart-container');
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 2 + 3) + 's';
            container.appendChild(heart);
            setTimeout(() => { heart.remove(); }, 5000);
        }
        setInterval(createHeart, 300);
        
        // RAW MEDIA LINKS FOR BETTER GITHUB PAGES LOADING
        const womanGifs = [
            "https://media1.tenor.com/m/On7be2S_T_wAAAAC/milk-and-mocha.gif", 
            "https://media1.tenor.com/m/HAn8V0K9MFAAAAAC/milk-and-mocha.gif", 
            "https://media1.tenor.com/m/YpsD67L97HAAAAAC/milk-and-mocha.gif", 
            "https://media1.tenor.com/m/97_1N86I19MAAAAAC/milk-and-mocha.gif", 
            "https://media1.tenor.com/m/uR6G-4T3_pYAAAAC/milk-and-mocha.gif"
        ];

        const noPhrases = [
            "Are you sure?", 
            "Pleaseeee🥹", 
            "If you didn't click on Yes, I'll be sad and kill you!!", 
            "I know you want Yes!🥳", 
            "Last Chance!", 
            "Catch me if you can!", 
            "Catch me if you can!"
        ];

        function handleNo() {
            clickCount++;
            const yesBtn = document.getElementById('yesBtn');
            const noBtn = document.getElementById('noBtn');
            const pookie = document.getElementById('pookie-img');

            if (clickCount < womanGifs.length) {
                pookie.src = womanGifs[clickCount];
            }

            let yesSize = 16 + (clickCount * 12); 
            yesBtn.style.fontSize = yesSize + 'px';
            yesBtn.style.padding = (12 + clickCount * 4) + 'px ' + (25 + clickCount * 8) + 'px';
            
            if (clickCount <= noPhrases.length) {
                noBtn.innerText = noPhrases[clickCount - 1];
            }
            
            // JUMPING LOGIC (6th and 7th click)
            if (clickCount >= 6 && clickCount <= 7) {
                noBtn.style.position = 'fixed';
                const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
                const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
                noBtn.style.left = x + 'px';
                noBtn.style.top = y + 'px';
            }

            // DISAPPEAR (8th click)
            if (clickCount >= 8) {
                noBtn.style.display = 'none';
            }
        }

        function celebrate() {
            document.getElementById('main-content').style.display = 'none';
            document.getElementById('celebration').style.display = 'block';
            document.body.style.backgroundColor = "#d63384";
            document.body.style.backgroundImage = "none";
            
            const end = Date.now() + 4000;
            (function frame() {
                confetti({ particleCount: 7, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#ffffff', '#ffb3c1'] });
                confetti({ particleCount: 7, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#ffffff', '#ffb3c1'] });
                if (Date.now() < end) requestAnimationFrame(frame);
            }());
        }
    </script>
</body>
</html>
