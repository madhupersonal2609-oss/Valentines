<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Subbu 💖</title>
    <style>
        :root { --baby-pink: #ffdae0; --deep-pink: #d63384; }

        body {
            background-color: var(--baby-pink);
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 100 100"><path d="M50 80c-20-15-30-25-30-35 0-10 10-15 15-15 5 0 10 5 15 10 5-5 10-10 15-10 5 0 15 5 15 15 0 10-10 20-30 35z" fill="%23ffb3c1" fill-opacity="0.4"/></svg>');
            font-family: 'Arial Rounded MT Bold', sans-serif;
            display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; overflow: hidden;
        }

        .container {
            background: rgba(255, 255, 255, 0.9);
            padding: 30px; border-radius: 40px; text-align: center; width: 350px; box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        /* The Animated Face Layering */
        .pookie-wrapper {
            position: relative; width: 200px; height: 200px; margin: 0 auto 20px;
        }

        #pookie-base { width: 100%; height: 100%; object-fit: contain; }

        /* Digital Eyes */
        .eye {
            position: absolute; width: 12px; height: 12px; background: #333;
            border-radius: 50%; top: 45%; animation: blink 4s infinite;
        }
        .eye.left { left: 35%; }
        .eye.right { right: 35%; }

        /* Digital Mouth */
        #mouth {
            position: absolute; width: 20px; height: 10px; border: 3px solid #333;
            border-top: 0; border-radius: 0 0 10px 10px; top: 60%; left: 47%;
            transition: all 0.3s ease;
        }

        @keyframes blink {
            0%, 90%, 100% { transform: scaleY(1); }
            95% { transform: scaleY(0.1); }
        }

        h1 { color: var(--deep-pink); font-size: 20px; }
        button { padding: 12px 25px; border-radius: 50px; border: none; font-weight: bold; cursor: pointer; }
        #yesBtn { background: #28a745; color: white; }
        #noBtn { background: #dc3545; color: white; position: relative; }

        .celebration { display: none; text-align: center; color: white; }
    </style>
</head>
<body>

    <div id="main-content" class="container">
        <div class="pookie-wrapper" id="pookie-box">
            <img id="pookie-base" src="pookie.png">
            <div class="eye left" id="l-eye"></div>
            <div class="eye right" id="r-eye"></div>
            <div id="mouth"></div>
        </div>

        <h1 id="question">Will you be my valentine, Subbu? ✨</h1>
        <div class="buttons">
            <button id="yesBtn" onclick="celebrate()">Yes ! 😍</button>
            <button id="noBtn" onclick="handleNo()">No 🤐</button>
        </div>
    </div>

    <div id="celebration" style="display:none;">
        <h1 style="font-size: 50px;">💖 It's Official! 💖</h1>
        <p style="font-size: 20px; padding: 20px; background: rgba(255,255,255,0.2); border-radius: 20px;">
            "Thanks for being the most wonderful, idiotic, sadistic and closest person to my heart ❤️!! Ofcourse you don't have choice of saying NO anymore ! You are stuck with me and me with you FOREVER!"
        </p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <script>
        let clickCount = 0;
        const noPhrases = ["Are you sure?", "Pleaseee🥹", "I'll be sad and kill you!!", "You want to click Yes!🥳", "Last Chance!"];

        function handleNo() {
            clickCount++;
            const mouth = document.getElementById('mouth');
            const eyes = document.querySelectorAll('.eye');
            const yesBtn = document.getElementById('yesBtn');
            const noBtn = document.getElementById('noBtn');

            // ANIMATE FACE
            if(clickCount === 1) { // SURPRISED
                mouth.style.height = "15px"; mouth.style.borderRadius = "50%";
            } else if(clickCount === 2) { // SAD
                mouth.style.borderRadius = "10px 10px 0 0"; mouth.style.borderBottom = "0"; mouth.style.borderTop = "3px solid #333";
            } else if(clickCount >= 3) { // ANGRY
                eyes.forEach(e => e.style.transform = "rotate(20deg)");
                document.getElementById('pookie-box').style.animation = "shake 0.2s infinite";
            }

            // BUTTON GROWTH
            yesBtn.style.fontSize = (16 + clickCount * 40) + "px";
            yesBtn.style.padding = (15 + clickCount * 15) + "px " + (30 + clickCount * 30) + "px";
            
            if (clickCount <= noPhrases.length) noBtn.innerText = noPhrases[clickCount-1];
            if (clickCount >= 5) {
                noBtn.style.position = 'fixed';
                noBtn.style.left = Math.random() * 80 + '%';
                noBtn.style.top = Math.random() * 80 + '%';
            }
            if (clickCount >= 6) noBtn.style.display = 'none';
        }

        function celebrate() {
            document.getElementById('main-content').style.display = 'none';
            document.getElementById('celebration').style.display = 'block';
            document.body.style.backgroundColor = "#d63384";
            confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
        }
    </script>
</body>
</html>
