<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Will You Be My Valentine?</title>
    <style>
        body {
            background-color: #fff0f3;
            font-family: 'Arial Rounded MT Bold', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 10px 25px rgba(255, 77, 109, 0.2);
            text-align: center;
            min-width: 300px;
            z-index: 10;
        }

        /* The Animation Box */
        #avatar-container {
            font-size: 80px;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }

        #heart-particle {
            display: inline-block;
            animation: beat 1s infinite;
        }

        @keyframes beat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        h1 { color: #ff4d6d; font-size: 24px; margin-bottom: 30px; }
        
        .buttons { display: flex; gap: 20px; align-items: center; justify-content: center; }
        
        button {
            padding: 15px 30px;
            font-size: 18px;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: bold;
        }

        #yesBtn { background-color: #ff4d6d; color: white; z-index: 100; }
        #noBtn { background-color: #ffccd5; color: #ff4d6d; position: relative; }

        .celebration { display: none; text-align: center; }
    </style>
</head>
<body>

    <div id="main-content" class="container">
        <div id="avatar-container">
            <span id="woman-emoji">👩🏻‍💼</span>
            <span id="heart-particle">💝</span>
            <span id="man-emoji">🤵🏻‍♂️</span>
        </div>

        <h1 id="question">Will you be my valentine, Subbu?</h1>

        <div class="buttons" id="btnGroup">
            <button id="yesBtn" onclick="celebrate()">Yes ! 😍</button>
            <button id="noBtn" onclick="handleNo()">No 🤐</button>
        </div>
    </div>

    <div id="celebration" class="celebration">
        <div style="font-size: 100px;">🎉💍💖</div>
        <h1 style="font-size: 40px; color: white;">I KNEW IT! 😍</h1>
        <p style="font-size: 20px; color: white;">Best Valentine's Day Ever, Subbu!</p>
    </div>

    <script>
        let clickCount = 0;
        
        // Expressions change based on your instructions
        const womanExpressions = ["👩🏻‍💼", "🤨", "🥺", "🔪", "😤", "😈"];
        const noPhrases = [
            "Are you sure ?????",
            "Pleaseeeeeeeee🥹",
            "If you say no, I will be sad and will kill you!!!!",
            "I know you want to click Yes !!!!🥳",
            "Last Chance !!!!"
        ];

        function handleNo() {
            clickCount++;
            const yesBtn = document.getElementById('yesBtn');
            const noBtn = document.getElementById('noBtn');
            const woman = document.getElementById('woman-emoji');
            const heart = document.getElementById('heart-particle');

            // 1. Update Expression
            if (clickCount < womanExpressions.length) {
                woman.innerText = womanExpressions[clickCount];
            }

            // 2. Change heart to something else if things get intense
            if (clickCount === 3) heart.innerText = "💢";
            if (clickCount === 5) heart.innerText = "⏳";

            // 3. Growth Logic
            let yesSize = 18 + (clickCount * 35); 
            yesBtn.style.fontSize = yesSize + 'px';
            yesBtn.style.padding = (15 + clickCount * 12) + 'px ' + (30 + clickCount * 25) + 'px';

            // 4. Shrink Logic
            let noSize = 18 - (clickCount * 2);
            noBtn.style.fontSize = Math.max(noSize, 5) + 'px';

            // 5. Update Phrases
            if (clickCount <= noPhrases.length) {
                noBtn.innerText = noPhrases[clickCount - 1];
            }

            // 6. Stage 6: Move and Disable
            if (clickCount >= 5) {
                moveButton(noBtn);
            }
            if (clickCount >= 6) {
                noBtn.style.pointerEvents = 'none';
                noBtn.style.visibility = 'hidden';
                woman.innerText = "🤷🏻‍♀️"; // The "I'm waiting" look
            }
        }

        function moveButton(btn) {
            const x = Math.random() * (window.innerWidth - btn.offsetWidth);
            const y = Math.random() * (window.innerHeight - btn.offsetHeight);
            btn.style.position = 'fixed';
            btn.style.left = x + 'px';
            btn.style.top = y + 'px';
        }

        function celebrate() {
            document.getElementById('main-content').style.display = 'none';
            document.getElementById('celebration').style.display = 'block';
            document.body.style.backgroundColor = "#ff4d6d";
        }
    </script>
</body>
</html>
