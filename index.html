<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Subbu 💖</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --baby-pink: #ffdae0;
            --deep-pink: #d63384;
        }

        body {
            background-color: var(--baby-pink);
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 100 100"><path d="M50 80c-20-15-30-25-30-35 0-10 10-15 15-15 5 0 10 5 15 10 5-5 10-10 15-10 5 0 15 5 15 15 0 10-10 20-30 35z" fill="%23ffb3c1" fill-opacity="0.4"/></svg>');
            font-family: 'Poppins', sans-serif;
            display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; overflow: hidden;
        }

        .heart {
            position: absolute; color: rgba(214, 51, 132, 0.5);
            animation: float 6s linear infinite; font-size: 20px; z-index: 1; pointer-events: none;
        }
        @keyframes float {
            0% { transform: translateY(110vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px; border-radius: 40px; box-shadow: 0 20px 50px rgba(214, 51, 132, 0.2);
            text-align: center; width: 340px; z-index: 10; border: 2px solid white;
            backdrop-filter: blur(5px);
        }

        .gif-box {
            width: 100%; min-height: 180px; display: flex; align-items: center; justify-content: center; margin-bottom: 15px;
        }

        .gif-box img {
            max-width: 100%; max-height: 200px; object-fit: contain; border-radius: 15px;
        }

        h1 { color: var(--deep-pink); font-size: 22px; margin-bottom: 25px; line-height: 1.4; }
        .buttons { display: flex; gap: 15px; justify-content: center; align-items: center; position: relative; }

        button {
            padding: 12px 25px; font-size: 16px; border: none; border-radius: 50px;
            cursor: pointer; font-weight: 600; transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #yesBtn { background-color: #28a745; color: white; z-index: 100; }
        #noBtn { background-color: #dc3545; color: white; position: relative; z-index: 99; }

        /* Celebration styles - now matching the main container */
        #celebration { display: none; }
        .official-title { font-family: 'Dancing Script', cursive; font-size: 42px; color: var(--deep-pink); margin: 10px 0; }
        .final-msg {
            font-size: 16px; line-height: 1.5; color: #333; font-weight: 400;
            background: rgba(255, 182, 193, 0.2); padding: 15px; border-radius: 20px;
        }
    </style>
</head>
<body>

    <div id="heart-container"></div>

    <div id="main-content" class="container">
        <div class="gif-box">
            <img id="pookie-img" src="https://github.com/user-attachments/assets/98aeb162-7348-4808-a5cc-fdf2edccf43c" alt="Asking">
        </div>
        <h1 id="question">Will you be my valentine, Subbu? ✨</h1>
        <div class="buttons">
            <button id="yesBtn" onclick="celebrate()">Yes ! 😍</button>
            <button id="noBtn" onclick="handleNo()">No 🤐</button>
        </div>
    </div>

    <div id="celebration" class="container">
        <div class="gif-box">
            <img src="https://github.com/user-attachments/assets/f00d205a-8993-4b6f-acb6-12283dd3deb8" alt="Celebration GIF">
        </div>
        <div class="official-title">It's Official!</div>
        <div class="final-msg">
            "Thanks for being the most wonderful, idiotic, sadistic and closest person to my heart ❤️!! Ofcourse you don't have choice of saying NO anymore ! You are stuck with me and me with you FOREVER!"
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <script>
        let clickCount = 0;

        function createHeart() {
            const container = document.getElementById('heart-container');
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 2 + 3) + 's';
            container.appendChild(heart);
            setTimeout(() => { heart.remove(); }, 5000);
        }
        setInterval(createHeart, 300);

        const noPhrases = [
            "Are you sure?", "Pleaseeee🥹", "If you didn't click on Yes, I'll be sad and kill you!!", 
            "I know you want Yes!🥳", "Last Chance!", "Catch me if you can!", "Catch me if you can!"
        ];

        function handleNo() {
            clickCount++;
            const yesBtn = document.getElementById('yesBtn');
            const noBtn = document.getElementById('noBtn');

            let yesSize = 16 + (clickCount * 12); 
            yesBtn.style.fontSize = yesSize + 'px';
            yesBtn.style.padding = (12 + clickCount * 4) + 'px ' + (25 + clickCount * 8) + 'px';
            
            if (clickCount <= noPhrases.length) {
                noBtn.innerText = noPhrases[clickCount - 1];
            }
            
            if (clickCount >= 6 && clickCount <= 7) {
                noBtn.style.position = 'fixed';
                const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
                const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
                noBtn.style.left = Math.max(0, x) + 'px';
                noBtn.style.top = Math.max(0, y) + 'px';
            }

            if (clickCount >= 8) {
                noBtn.style.display = 'none';
            }
        }

        function celebrate() {
            // Hide the question card
            document.getElementById('main-content').style.display = 'none';
            // Show the celebration card
            const celebDiv = document.getElementById('celebration');
            celebDiv.style.display = 'block';
            
            // Keep the pink background and just trigger confetti
            const end = Date.now() + 5000;
            (function frame() {
                confetti({ particleCount: 10, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#ffdae0', '#d63384', '#ffffff'] });
                confetti({ particleCount: 10, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#ffdae0', '#d63384', '#ffffff'] });
                if (Date.now() < end) requestAnimationFrame(frame);
            }());
        }
    </script>
</body>
</html>
