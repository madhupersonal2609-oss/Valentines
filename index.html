<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Subbu 💖</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #ffdae0;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 100 100"><path d="M50 80c-20-15-30-25-30-35 0-10 10-15 15-15 5 0 10 5 15 10 5-5 10-10 15-10 5 0 15 5 15 15 0 10-10 20-30 35z" fill="%23ffb3c1" fill-opacity="0.5"/></svg>');
            font-family: 'Poppins', sans-serif;
            display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; overflow: hidden;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px; border-radius: 40px; text-align: center; width: 350px; 
            box-shadow: 0 20px 50px rgba(214, 51, 132, 0.2); border: 2px solid white;
        }

        #pookie-img {
            width: 180px; height: 180px; object-fit: contain; margin-bottom: 20px;
        }

        h1 { color: #d63384; font-size: 22px; margin-bottom: 30px; line-height: 1.4; }

        .buttons { display: flex; gap: 15px; justify-content: center; align-items: center; }

        button {
            padding: 12px 25px; font-size: 16px; border: none; border-radius: 50px;
            cursor: pointer; font-weight: 600; transition: all 0.3s ease;
        }

        #yesBtn { background-color: #28a745; color: white; }
        #noBtn { background-color: #dc3545; color: white; position: relative; }

        #celebration { display: none; text-align: center; padding: 20px; }
        .official-title { font-family: 'Dancing Script', cursive; font-size: 45px; color: white; margin-bottom: 15px; }
        .final-msg {
            background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(10px);
            padding: 25px; border-radius: 20px; color: white; font-size: 18px; line-height: 1.6;
            border: 1px solid rgba(255,255,255,0.3);
        }
    </style>
</head>
<body>

    <div id="main-content" class="container">
        <img id="pookie-img" src="https://media.tenor.com/2m7VvY1iR_0AAAAi/milk-and-mocha.gif" alt="Asking">
        
        <h1 id="question">Will you be my valentine, Subbu? ✨</h1>

        <div class="buttons">
            <button id="yesBtn" onclick="celebrate()">Yes ! 😍</button>
            <button id="noBtn" onclick="handleNo()">No 🤐</button>
        </div>
    </div>

    <div id="celebration">
        <img src="https://media.tenor.com/866Bq1U6YpUAAAAi/milk-and-mocha.gif" style="width: 250px; margin-bottom: 20px;">
        <div class="official-title">It's Official!</div>
        <p class="final-msg">"Thanks for being the most wonderful, idiotic, sadistic and closest person to my heart ❤️!! Ofcourse you don't have choice of saying NO anymore ! You are stuck with me and me with you FOREVER!"</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <script>
        let clickCount = 0;
        
        // These are the most stable "Direct" links for the woman bear's expressions
        const womanGifs = [
            "https://media.tenor.com/2m7VvY1iR_0AAAAi/milk-and-mocha.gif", // Asking
            "https://media.tenor.com/9vD_S5S6f68AAAAi/milk-mocha.gif",    // Sad/Upset
            "https://media.tenor.com/mO62L7-60fUAAAAi/milk-and-mocha.gif", // Crying
            "https://media.tenor.com/X-f_B6vY57AAAAAi/milk-and-mocha.gif", // ANGRY
            "https://media.tenor.com/p_uB-hYtC_IAAAAi/milk-and-mocha.gif"  // Despair
        ];

        const noPhrases = ["Are you sure?", "Pleaseeee🥹", "I'll be sad and kill you!!", "I know you want Yes!🥳", "Last Chance!"];

        function handleNo() {
            clickCount++;
            const pookie = document.getElementById('pookie-img');
            const yesBtn = document.getElementById('yesBtn');
            const noBtn = document.getElementById('noBtn');

            // 1. Force GIF change
            if (clickCount < womanGifs.length) {
                pookie.src = womanGifs[clickCount];
            }

            // 2. Grow Yes Button
            let size = 16 + (clickCount * 45);
            yesBtn.style.fontSize = size + "px";
            yesBtn.style.padding = (size/2) + "px " + (size) + "px";

            // 3. Update No button text
            if (clickCount <= noPhrases.length) {
                noBtn.innerText = noPhrases[clickCount-1];
            }

            // 4. Run away logic
            if (clickCount >= 4) {
                noBtn.style.position = 'fixed';
                noBtn.style.left = Math.random() * 80 + '%';
                noBtn.style.top = Math.random() * 80 + '%';
            }
        }

        function celebrate() {
            document.getElementById('main-content').style.display = 'none';
            document.getElementById('celebration').style.display = 'block';
            document.body.style.backgroundColor = "#d63384";
            document.body.style.backgroundImage = "none";
            confetti({ particleCount: 200, spread: 100, origin: { y: 0.6 } });
        }
    </script>
</body>
</html>
