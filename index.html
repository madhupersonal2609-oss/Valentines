<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Subbu 💖</title>
    <style>
        :root { --pookie-pink: #ff85a1; --hot-pink: #ff4d6d; --soft-bg: #ffe5ec; }
        body {
            background-color: var(--soft-bg);
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            cursor: url('https://cur.cursors-4u.net/symbols/sym-1/sym46.cur'), auto;
        }

        /* Floating Hearts Background */
        .heart-particle {
            position: absolute;
            pointer-events: none;
            animation: floatUp 2s linear forwards;
            color: var(--hot-pink);
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-100px) scale(0); opacity: 0; }
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 40px;
            box-shadow: 0 20px 50px rgba(255, 77, 109, 0.3);
            text-align: center;
            z-index: 10;
            transition: transform 0.3s;
        }

        /* The Interactive Girl Image */
        #girl-avatar {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            border: 5px solid var(--pookie-pink);
            margin-bottom: 20px;
            object-fit: cover;
            transition: all 0.3s ease;
        }

        h1 { color: var(--hot-pink); font-size: 24px; margin-bottom: 30px; }

        .btn-wrapper { display: flex; gap: 20px; justify-content: center; align-items: center; min-height: 100px; }

        button {
            padding: 15px 35px;
            font-size: 18px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #yesBtn { background: var(--hot-pink); color: white; box-shadow: 0 5px 15px rgba(255, 77, 109, 0.4); }
        #noBtn { background: #adb5bd; color: white; position: relative; }

        #celebration { display: none; }
    </style>
</head>
