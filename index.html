<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Subbu 💖</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --baby-pink: #ffdae0;
            --heart-color: #ffb3c1;
            --valentines-red: #dc3545;
            --success-green: #28a745;
            --deep-pink: #d63384;
        }

        body {
            background-color: var(--baby-pink);
            /* This creates the romantic heart pattern background */
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 100 100"><path d="M50 80c-20-15-30-25-30-35 0-10 10-15 15-15 5 0 10 5 15 10 5-5 10-10 15-10 5 0 15 5 15 15 0 10-10 20-30 35z" fill="%23ffb3c1" fill-opacity="0.5"/></svg>');
            font-family: 'Poppins', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            transition: all 0.8s ease;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 40px;
            box-shadow: 0 20px 50px rgba(214, 51, 132, 0.15);
            text-align: center;
            width: 350px;
            z-index: 10;
        }

        #pookie-box {
            width: 180px;
            height: 180px;
            margin: 0 auto 20px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #pookie-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: all 0.4s ease;
        }

        h1 { color: var(--deep-pink); font-size: 22px; margin-bottom: 30px; line-height: 1.4; }

        .buttons { display: flex; gap: 15px; justify-content: center; align-items: center; }

        button {
            padding: 12px 25px;
            font-size: 16px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        #yesBtn { background-color: var(--success-green); color: white; }
        #noBtn { background-color: var(--valentines-red); color: white; position: relative; }

        #celebration {
            display: none;
            text-align: center;
            max-width: 500px;
            padding: 20px;
        }

        .official-title {
            font-family: 'Dancing Script', cursive;
            font-size: 45px;
            color: white;
            margin-bottom: 20px;
        }

        .final-msg {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            padding: 25px;
            border-radius: 20px;
            color: white;
            font-size: 18px;
            line-height: 1.6;
            border: 1px solid rgba(255,255,255,0.3);
        }

        .shake { animation: shake 0.5s infinite; }
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            20% { transform: translate(-3px, 0px) rotate(-1deg); }
            40% { transform: translate(3px, 2px) rotate(1deg); }
            100% { transform: translate(1px, -1px) rotate(0deg); }
        }
    </style>
</head>
<body>

    <div id="main-content" class="container">
        <div id="pookie-box">
            <img id="pookie-img" src="pookie.png" alt="Pookie">
        </div>

        <h1 id="question">Will you be my valentine, Subbu? ✨</h1>

        <div class="buttons" id="btnGroup">
            <button id="yesBtn" onclick="celebrate()">Yes ! 😍</button>
            <button id="noBtn" onclick="handleNo()">No 🤐</button>
        </div>
    </div>

    <div id="celebration">
        <div style="font-size: 100px; margin-bottom: 20px;">🎉💖</div>
        <div class="official-title">It's Official!</div>
        <div class="final-msg">
            "Thanks for being the most wonderful, idiotic, sadistic and closest person to my heart ❤️!! Ofcourse you don't have choice of saying NO anymore ! You are stuck with me and me with you FOREVER!"
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <script>
        let clickCount = 0;
        const noPhrases = [
            "Are you sure ?????",
            "Pleaseeeeeeeee🥹",
            "If you say no, I will be sad and will kill you!!!!",
            "I know you want to click Yes !!!!🥳",
            "Last Chance !!!!"
        ];

        function handleNo() {
            clickCount++;
            const yesBtn = document.getElementById('yesBtn');
            const noBtn = document.getElementById('noBtn');
            const pookie = document.getElementById('pookie-img');

            // INTERACTIVE POOKIE EXPRESSIONS
            if (clickCount === 1) { 
                pookie.style.transform = "rotate(-15deg)"; 
            }
            if (clickCount === 2) { 
                pookie.style.filter = "grayscale(80%)"; 
                pookie.style.transform = "scale(0.8)";
            }
            if (clickCount === 3) { 
                pookie.style.filter = "hue-rotate(300deg) saturate(3)"; 
                pookie.style.transform = "scale(1.2)";
                pookie.classList.add('shake');
            }
            if (clickCount === 4) { 
                pookie.style.filter = "brightness(0.5) sepia(1)"; 
            }

            // BUTTON LOGIC
            let yesSize = 16 + (clickCount * 40); 
            yesBtn.style.fontSize = yesSize + 'px';
            yesBtn.style.padding = (15 + clickCount * 15) + 'px ' + (30 + clickCount * 30) + 'px';
            
            let noSize = 16 - (clickCount * 2);
            noBtn.style.fontSize = Math.max(noSize, 4) + 'px';

            if (clickCount <= noPhrases.length) {
                noBtn.innerText = noPhrases[clickCount - 1];
            }

            if (clickCount >= 5) { moveButton(noBtn); }
            if (clickCount >= 6) { noBtn.style.display = 'none'; }
        }

        function moveButton(btn) {
            const x = Math.random() * (window.innerWidth - btn.offsetWidth);
            const y = Math.random() * (window.innerHeight - btn.offsetHeight);
            btn.style.position = 'fixed';
            btn.style.left = x + 'px';
            btn.style.top = y + 'px';
        }

        function celebrate() {
            document.getElementById('main-content').style.display = 'none';
            document.getElementById('celebration').style.display = 'block';
            document.body.style.backgroundColor = "#d63384";
            document.body.style.backgroundImage = "none";
            
            // Blast confetti!
            confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
        }
    </script>
</body>
</html>
